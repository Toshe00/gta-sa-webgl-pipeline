name: Publication checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reviewed-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm run check
      - run: npm run build
      # No Unity assets, game builds, saves, caches, browser profiles or secrets uploaded.
      # Vercel Git integration reruns this same fail-closed build before deployment.
